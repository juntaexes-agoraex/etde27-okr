<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>AP1 · Administración Pública — ÁgoraEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ─── RESET ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ─── DESIGN TOKENS ─────────────────────────────────── */
:root{
  --bg:#eef2fc;
  --card:#ffffff;
  --border:rgba(32,92,242,.10);
  --shadow:0 4px 24px rgba(32,92,242,.08),0 1px 4px rgba(32,92,242,.05);

  --blue:#205cf2;    --blue-l:#3b6ef0;  --blue-d:#1545d4;
  --teal:#5adaa4;    --teal-l:#3dc78e;  --teal-d:#28a87a;
  --amber:#e08f00;
  --rose:#e0294f;
  --cyan:#0598b8;
  --lime:#5f9900;

  --text:#0b1739;    --text-l:#1e3060;
  --muted:#5c7299;   --muted-l:#8fa5c2;

  /* F1 = display / numbers / headings */
  --f1:'Plus Jakarta Sans',system-ui,sans-serif;
  /* F2 = body / labels / secondary */
  --f2:'Inter',system-ui,sans-serif;
}

/* ─── GRADIENT TEXT ──────────────────────────────────── */
.grad{
  background:linear-gradient(135deg,#1a45e6 0%,#205cf2 25%,#0598b8 58%,#5adaa4 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

/* ─── BASE ───────────────────────────────────────────── */
html,body{
  height:100vh;width:100vw;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:var(--f2);font-size:13px;
  font-feature-settings:'tnum'
}

/* ─── PAGE WRAP — 1920×1080 canvas ──────────────────── */
#page-wrap{
  position:fixed;top:0;left:0;
  width:1920px;height:1080px;
  transform-origin:top left;
  overflow:hidden
}
/* subtle multi-layer background depth */
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 55% at 10% 20%,  rgba(32,92,242,.055) 0%,transparent 70%),
    radial-gradient(ellipse 55% 50% at 92% 80%,  rgba(90,218,164,.045) 0%,transparent 65%),
    radial-gradient(ellipse 40% 40% at 55% 50%,  rgba(5,152,184,.025)  0%,transparent 60%)
}
body::before{
  content:'';position:fixed;inset:0;
  background-image:radial-gradient(rgba(32,92,242,.03) 1px,transparent 1px);
  background-size:32px 32px;pointer-events:none;z-index:0
}

/* ─── HEADER ─────────────────────────────────────────── */
#hdr{
  position:absolute;top:0;left:0;right:0;height:82px;z-index:300;
  background:rgba(255,255,255,.98);border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);
  display:flex;align-items:center;gap:14px;padding:0 32px;
  box-shadow:0 2px 20px rgba(32,92,242,.09)
}
.logo-wrap{height:62px;display:flex;align-items:center;flex-shrink:0}
.hdr-sep{width:1px;height:54px;background:var(--border);flex-shrink:0;margin:0 6px}
.hdr-kpis{display:flex;gap:0;flex:1;justify-content:space-evenly;align-items:center}
.hdr-kpi{display:flex;flex-direction:column;align-items:center}
.hdr-v{
  font-family:var(--f1);font-size:38px;font-weight:800;
  line-height:1;letter-spacing:-2px
}
.hdr-l{
  font-family:var(--f2);font-size:9.5px;color:var(--muted-l);
  text-transform:uppercase;letter-spacing:.9px;margin-top:2px
}
.hdr-right{margin-left:auto;text-align:right;flex-shrink:0}
.hdr-ev{font-family:var(--f2);font-size:9px;color:var(--muted-l);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:3px}
.hdr-dt{font-family:var(--f1);font-size:15px;font-weight:800;letter-spacing:-.5px}
.live-badge{
  display:inline-flex;align-items:center;gap:6px;margin-left:12px;
  background:rgba(224,41,79,.09);border:1px solid rgba(224,41,79,.28);
  border-radius:100px;padding:5px 13px;flex-shrink:0
}
.live-dot{
  width:7px;height:7px;border-radius:50%;background:#e0294f;flex-shrink:0;
  animation:pulse 1.5s ease-in-out infinite
}
.live-lbl{font-family:var(--f2);font-size:11px;font-weight:700;color:#e0294f;letter-spacing:.5px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.live-hidden{display:none!important}

/* ─── MAIN LAYOUT ────────────────────────────────────── */
#main{
  position:absolute;inset:82px 0 0 0;
  display:grid;
  grid-template-rows:40px 140px 1fr 0.62fr;
  gap:20px;padding:16px 24px;
  overflow:hidden;z-index:1
}

/* ─── TITLE STRIP ────────────────────────────────────── */
#ts{
  display:flex;align-items:center;gap:14px;
  padding:0 2px;flex-shrink:0
}
.ts-ap{
  font-family:var(--f1);font-size:11px;font-weight:800;letter-spacing:.6px;
  background:var(--blue);color:#fff;
  padding:5px 13px;border-radius:100px;flex-shrink:0
}
.ts-title{
  font-family:var(--f1);font-size:26px;font-weight:800;
  color:var(--text);letter-spacing:-.7px;white-space:nowrap
}
.ts-title em{font-style:italic;color:var(--teal-d)}
.ts-sub{
  font-family:var(--f2);font-size:12px;color:var(--muted);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.ts-claim{
  font-family:var(--f1);font-size:16px;font-weight:700;
  white-space:nowrap;color:var(--blue);letter-spacing:-.2px
}
.ts-claim em{font-style:normal;color:var(--teal-d)}
.ts-quote{
  margin-left:auto;font-family:var(--f1);font-size:11.5px;
  font-weight:600;font-style:italic;color:var(--muted);
  border-left:2.5px solid var(--teal);padding-left:10px;
  white-space:nowrap;flex-shrink:0
}

/* ─── CARD ───────────────────────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:20px 24px;display:flex;flex-direction:column;
  position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:0
}
/* section eyebrow: icon + sentence-case title */
.c-ey{
  display:flex;align-items:center;gap:8px;
  font-family:var(--f1);font-size:17px;font-weight:700;
  color:var(--text-l);letter-spacing:-.2px;
  flex-shrink:0;margin-bottom:6px
}
.c-ey svg{flex-shrink:0;color:var(--blue);opacity:.8}
.c-sub{
  font-family:var(--f2);font-size:13px;color:var(--muted);
  flex-shrink:0;margin-bottom:10px;line-height:1.45
}

/* ─── KPI ROW ────────────────────────────────────────── */
#kpi-row{
  display:grid;grid-template-columns:repeat(5,1fr);gap:14px;min-height:0
}
.kc{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px 20px;display:flex;flex-direction:column;
  position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:0
}
.kc::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  border-radius:16px 16px 0 0
}
.ka-blue::before{background:linear-gradient(90deg,#1545d4,#3b6ef0)}
.ka-teal::before{background:linear-gradient(90deg,var(--teal-d),var(--teal))}
.ka-amber::before{background:linear-gradient(90deg,#c87a00,var(--amber))}
.ka-cyan::before{background:linear-gradient(90deg,#047a94,var(--cyan))}
.ka-lime::before{background:linear-gradient(90deg,#487500,var(--lime))}

.kc-top{display:flex;align-items:center;gap:9px;margin-bottom:3px;flex-shrink:0}
.kc-ico{
  width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.ki-blue{background:rgba(32,92,242,.09);color:var(--blue)}
.ki-teal{background:rgba(90,218,164,.14);color:var(--teal-d)}
.ki-amber{background:rgba(224,143,0,.1);color:var(--amber)}
.ki-cyan{background:rgba(5,152,184,.1);color:var(--cyan)}
.ki-lime{background:rgba(95,153,0,.1);color:var(--lime)}

.kc-lbl{font-family:var(--f2);font-size:13px;font-weight:700;color:var(--text-l);line-height:1.25;flex:1}
.kc-pct{
  font-family:var(--f1);font-size:56px;font-weight:800;
  line-height:1;letter-spacing:-3px;flex:1;
  display:flex;align-items:flex-end;gap:1px
}
.kc-pct sup{font-size:.38em;letter-spacing:0;font-weight:800;padding-bottom:8px}
.kp-blue{color:var(--blue)}
.kp-teal{color:var(--teal-d)}
.kp-amber{color:var(--amber)}
.kp-cyan{color:var(--cyan)}
.kp-lime{color:var(--lime)}

.kc-desc{font-family:var(--f2);font-size:13px;color:var(--muted);line-height:1.5;flex-shrink:0}

/* ─── MID ROW ────────────────────────────────────────── */
#mid{
  display:grid;grid-template-columns:41fr 23fr 36fr;gap:20px;min-height:0
}

/* RANKING */
.rank-list{
  display:flex;flex-direction:column;flex:1;min-height:0;
  justify-content:space-around
}
.ri{
  display:flex;align-items:center;gap:14px;padding:9px 0;
  border-bottom:1px solid var(--border)
}
.ri:last-child{border-bottom:none}
.ri-pos{
  font-family:var(--f1);font-size:30px;font-weight:800;
  min-width:34px;text-align:center;flex-shrink:0;line-height:1
}
.ri-body{flex:1;min-width:0}
.ri-lbl{
  font-family:var(--f2);font-size:17px;font-weight:700;
  color:var(--text);margin-bottom:7px;line-height:1.2
}
.ri-track{height:12px;background:rgba(0,0,0,.06);border-radius:6px;overflow:hidden}
.ri-fill{
  height:100%;border-radius:6px;
  transition:width .7s cubic-bezier(.4,0,.2,1)
}
.ri-pct{
  font-family:var(--f1);font-size:30px;font-weight:800;
  min-width:62px;text-align:right;flex-shrink:0;letter-spacing:-.5px
}
/* rank colors */
.rc1{color:#205cf2}.rc2{color:#0598b8}.rc3{color:#3dc78e}.rc4{color:#5f9900}.rc5{color:#9aadca}
.rf1{background:linear-gradient(90deg,#205cf2,#3b6ef0)}
.rf2{background:linear-gradient(90deg,#0598b8,#2cc8e0)}
.rf3{background:linear-gradient(90deg,#3dc78e,#5adaa4)}
.rf4{background:linear-gradient(90deg,#5f9900,#88cc00)}
.rf5{background:#c0cce8}

/* DONUT */
#donut-card{align-items:center;justify-content:center;gap:10px}
.donut-wrap{
  position:relative;flex-shrink:0;margin:0 auto
}
.donut-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none;
  text-align:center;padding:16px
}
.d-big{
  font-family:var(--f1);font-size:74px;font-weight:800;
  color:var(--blue);line-height:1;letter-spacing:-4px
}
.d-sub{font-family:var(--f2);font-size:10.5px;color:var(--muted);font-weight:600;line-height:1.35;margin-top:4px}
.donut-legend{
  display:flex;flex-direction:column;gap:7px;
  width:100%;flex-shrink:0
}
.dl{display:flex;align-items:center;gap:8px}
.dl-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.dl-txt{font-family:var(--f2);font-size:13px;color:var(--muted);flex:1;font-weight:500}
.dl-pct{font-family:var(--f1);font-size:15px;font-weight:700;color:var(--text)}

/* WORD CLOUD */
#words-card{}
.wcloud{
  flex:1;position:relative;min-height:0;overflow:hidden
}
.ww{
  font-family:var(--f1);font-weight:700;white-space:nowrap;
  cursor:default;line-height:1.25;
  transition:opacity .25s,transform .25s
}
.ww:hover{opacity:1!important;transform:scale(1.06)}

/* ─── BOT ROW ────────────────────────────────────────── */
#bot{
  display:grid;grid-template-columns:40fr 36fr 24fr;gap:20px;min-height:0
}

/* SEGMENTATION */
#seg-card{}
.seg-cols{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:8px;flex:1;min-height:0
}
.seg-col{
  display:flex;flex-direction:column;justify-content:center;
  background:var(--bg);border-radius:14px;
  border:1px solid var(--border);
  padding:12px 12px;min-height:0
}
.seg-age{
  font-family:var(--f1);font-size:16px;font-weight:800;
  color:var(--text-l);margin-bottom:4px;flex-shrink:0
}
.seg-big{
  font-family:var(--f1);font-size:42px;font-weight:800;
  line-height:1;letter-spacing:-2px;margin-bottom:7px;flex-shrink:0
}
.seg-bar{
  height:6px;background:rgba(0,0,0,.07);border-radius:4px;
  overflow:hidden;margin-bottom:0;flex-shrink:0
}
.seg-bar-fill{
  height:100%;border-radius:4px;
  transition:width .8s cubic-bezier(.4,0,.2,1)
}
.seg-rows{display:flex;flex-direction:column;gap:6px;flex:1}
.seg-row{display:flex;align-items:center;gap:5px}
.seg-row-lbl{
  font-family:var(--f2);font-size:10px;color:var(--text-l);
  font-weight:600;flex:1;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;line-height:1.2
}
.seg-row-track{
  width:44px;height:5px;background:rgba(0,0,0,.07);
  border-radius:3px;overflow:hidden;flex-shrink:0
}
.seg-row-fill{
  height:100%;border-radius:3px;
  transition:width .8s cubic-bezier(.4,0,.2,1)
}
.seg-row-pct{
  font-family:var(--f1);font-size:12px;font-weight:800;
  min-width:30px;text-align:right;flex-shrink:0
}

/* INSIGHT */
#insight-card{justify-content:center;gap:12px}
.ins-tag{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--f2);font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:1.6px;color:var(--blue);
  background:rgba(32,92,242,.07);border:1px solid rgba(32,92,242,.18);
  border-radius:100px;padding:5px 13px;align-self:flex-start;flex-shrink:0
}
.ins-body{display:flex;flex-direction:column;justify-content:center;gap:4px;flex:1}
.ins-q{display:none}
.ins-txt{
  font-family:var(--f1);font-size:30px;font-weight:700;
  color:var(--text);line-height:1.35;letter-spacing:-.5px
}
.ins-txt em{font-style:italic;color:var(--teal-d);font-weight:700}
.ins-txt strong{
  font-weight:800;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text
}
.ins-note{
  font-family:var(--f2);font-size:10.5px;color:var(--muted);
  line-height:1.5;flex-shrink:0;border-top:1px solid var(--border);
  padding-top:9px
}

/* CONCLUSIONS */
#concl-card{}
.concl-list{
  display:flex;flex-direction:column;flex:1;
  min-height:0;justify-content:space-around
}
.cl{
  display:flex;align-items:flex-start;gap:12px;
  padding:7px 0;border-bottom:1px solid var(--border)
}
.cl:last-child{border-bottom:none}
.cl-n{
  font-family:var(--f1);font-size:26px;font-weight:800;
  line-height:1;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text
}
.cl-txt{
  font-family:var(--f2);font-size:14px;color:var(--text);
  font-weight:500;line-height:1.5;padding-top:1px
}

/* ─── MICROANIMATIONS ────────────────────────────────── */
@media (prefers-reduced-motion: reduce){
  .ri-fill,.seg-bar-fill,.seg-row-fill,
  .ww,.kc-pct{transition:none!important}
  .live-dot{animation:none!important;opacity:1}
  body::after{display:none}
}
</style>
</head>
<body>

<!-- ══════════════════════ PAGE WRAP ══════════════════════ -->
<div id="page-wrap">

<!-- ══════════════════════ HEADER ══════════════════════ -->
<header id="hdr">
  <div class="logo-wrap">
    <svg viewBox="88 409 762 225" height="62" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lg1" x1="92.9" y1="514.7" x2="320.4" y2="514.7" gradientUnits="userSpaceOnUse">
          <stop offset=".5" stop-color="#205cf2"/><stop offset=".9" stop-color="#5adaa4"/>

function renderKPIs() {

}

  new Chart(document.getElementById('donut-cv'), {

      }]
    },

      cutout: '74%',
      plugins: { legend:{ display:false }, tooltip:{ enabled:false } }
    }
  });
}

function renderWordCloud() {
  const card = document.getElementById('words-card');
  card.innerHTML = `
    <div class="c-ey">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      Lo que más se repite
    </div>
    <div class="c-sub">Palabras más mencionadas en los comentarios libres</div>
    <div class="wcloud" id="wcloud-box"></div>`;

  // Defer until fonts are loaded so measureText uses the real typeface
  document.fonts.ready.then(() => {
    const box = document.getElementById('wcloud-box');
    if (!box) return;

    const W = box.offsetWidth;
    const H = box.offsetHeight;
    const words = DATA.words.slice(0, 8);
    const maxWt = Math.max(...words.map(w => w.weight));
    const MIN_SIZE = 22, MAX_SIZE = 62;
    const PAD = 14, GAP_X = 20, GAP_Y = 16;

    // Measure each word with canvas (accurate after fonts.ready)
    const mc = document.createElement('canvas').getContext('2d');
    const items = words.map(w => {
      const size = Math.round(MIN_SIZE + (w.weight / maxWt) * (MAX_SIZE - MIN_SIZE));
      mc.font = `800 ${size}px 'Plus Jakarta Sans', sans-serif`;
      const tw = Math.ceil(mc.measureText(w.text).width) + 8; // +8px safety
      const th = Math.ceil(size * 1.28);
      return { text: w.text, color: w.color, size, tw, th };
    });

    // Greedy row-based layout
    const rows = [];
    let curRow = [], curW = 0;
    const maxRowW = W - 2 * PAD;

    for (const item of items) {
      const needed = curRow.length === 0 ? item.tw : curW + GAP_X + item.tw;
      if (needed > maxRowW && curRow.length > 0) {
        rows.push(curRow);
        curRow = [item];
        curW = item.tw;
      } else {
        curRow.push(item);
        curW = needed;
      }
    }
    if (curRow.length > 0) rows.push(curRow);

    // Calculate total block height
    const rowHs = rows.map(r => Math.max(...r.map(i => i.th)));
    const totalH = rowHs.reduce((s, h) => s + h, 0) + Math.max(0, rows.length - 1) * GAP_Y;

    // Vertically center the block
    let y = PAD + Math.max(0, (H - 2 * PAD - totalH) / 2);

    const spanEls = [];
    rows.forEach((row, ri) => {
      const rh = rowHs[ri];
      const rowTotalW = row.reduce((s, i) => s + i.tw, 0) + (row.length - 1) * GAP_X;
      // Center each row horizontally
      let x = PAD + Math.max(0, (maxRowW - rowTotalW) / 2);

      row.forEach(item => {
        // Clamp to safe bounds
        const left = Math.min(Math.round(x), W - PAD - item.tw);
        const top  = Math.round(y + (rh - item.th) / 2);
        spanEls.push(
          `<span class="ww" style="position:absolute;left:${left}px;top:${top}px;` +
          `font-size:${item.size}px;color:${item.color}">${item.text}</span>`
        );
        x += item.tw + GAP_X;
      });

      y += rh + GAP_Y;
    });

    box.innerHTML = spanEls.join('');
  });
}

// ─── VIEWPORT SCALE ───────────────────────────────────
function fitToViewport() {
  const W = 1920, H = 1080;
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  const offsetX = Math.round((window.innerWidth  - W * scale) / 2);
  const offsetY = Math.round((window.innerHeight - H * scale) / 2);
  const wrap = document.getElementById('page-wrap');
  wrap.style.transform = `scale(${scale})`;
  wrap.style.left = offsetX + 'px';
  wrap.style.top  = offsetY + 'px';
}
window.addEventListener('resize', fitToViewport);
fitToViewport();
