name: Recordatorio OKR ETDE27

on:
  schedule:
    - cron: '0 7 * * 1'   # Cada lunes a las 7:00 UTC = 8:00h (invierno) / 9:00h (verano)
  workflow_dispatch:        # Permite ejecutar manualmente desde GitHub para pruebas

jobs:
  recordatorio:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install nodemailer

      - name: Comprobar indicadores y enviar recordatorios
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: node okr-etde27/scripts/check-reminders.js

      - name: Guardar log de notificaciones en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add okr-etde27/data/notificaciones.json
          git diff --cached --quiet || git commit -m "chore: actualizar log de notificaciones [skip ci]"
          git push
