<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÁgoraEX — Dinámica 1 Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#205CF2;color:#fff;font-family:system-ui,-apple-system,sans-serif;width:100vw;height:100vh;overflow:hidden;display:flex;flex-direction:column}
#header{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:80px;background:rgba(0,0,0,0.15);border-bottom:1px solid rgba(255,255,255,0.12);flex-shrink:0}
#header-left{display:flex;align-items:center;gap:14px}
#header-left span{font-size:22px;font-weight:700;letter-spacing:0.04em;color:#fff}
#header-center{font-size:32px;font-weight:800;letter-spacing:0.06em;color:#fff;text-align:center;flex:1}
#header-right{font-size:14px;color:#5ADAA4;font-variant-numeric:tabular-nums;white-space:nowrap}
#main{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:24px;padding:24px 40px;overflow:hidden}
.card{border-radius:20px;padding:32px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.card-bg-default{background:rgba(255,255,255,0.12)}
.card-bg-blue{background:rgba(255,255,255,0.18)}
.card-label{font-size:18px;color:rgba(255,255,255,0.6);margin-top:8px;font-weight:500}
.card-big{font-size:96px;font-weight:900;line-height:1;color:#fff;transition:all 0.4s ease}
.card-top{display:flex;align-items:center;gap:16px}
.card-body{flex:1;display:flex;flex-direction:column;justify-content:center}
.card-tema{font-size:38px;font-weight:800;color:#fff;line-height:1.1;margin-top:12px;transition:all 0.4s ease}
.card-idea{font-size:34px;font-weight:700;color:#5ADAA4;line-height:1.3;font-style:italic;margin-top:12px;transition:all 0.4s ease}
.card-pct{font-size:64px;font-weight:900;color:#5ADAA4;line-height:1;transition:all 0.4s ease}
.progress-track{width:100%;height:18px;background:rgba(255,255,255,0.15);border-radius:9px;overflow:hidden;margin:16px 0 10px}
.progress-fill{height:100%;background:#5ADAA4;border-radius:9px;transition:width 0.6s ease}
.progress-label{font-size:24px;font-weight:700;color:#fff}
#footer{display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:60px;background:rgba(0,0,0,0.15);border-top:1px solid rgba(255,255,255,0.12);flex-shrink:0}
#footer-left{display:flex;align-items:center;gap:12px;color:rgba(255,255,255,0.6);font-size:13px}
#footer-right{font-family:Georgia,serif;text-transform:uppercase;font-size:12px;color:rgba(255,255,255,0.6);letter-spacing:0.08em}
</style>
</head>
<body>

<div id="header">
  <div id="header-left">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="22" y1="22" x2="31" y2="13" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="31" y2="31" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="13" y2="31" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="13" y2="13" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="22" y2="8" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="36" y2="22" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="22" y2="36" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="22" y1="22" x2="8" y2="22" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="31" y1="13" x2="37" y2="7" stroke="#5ADAA4" stroke-width="1" stroke-linecap="round" opacity=".7"/>
      <line x1="31" y1="31" x2="37" y2="37" stroke="#5ADAA4" stroke-width="1" stroke-linecap="round" opacity=".7"/>
      <line x1="13" y1="31" x2="7" y2="37" stroke="#5ADAA4" stroke-width="1" stroke-linecap="round" opacity=".7"/>
      <line x1="13" y1="13" x2="7" y2="7" stroke="#5ADAA4" stroke-width="1" stroke-linecap="round" opacity=".7"/>
      <circle cx="37" cy="7" r="2.5" fill="#5ADAA4" opacity=".75"/>
      <circle cx="37" cy="37" r="2.5" fill="#5ADAA4" opacity=".75"/>
      <circle cx="7" cy="37" r="2.5" fill="#5ADAA4" opacity=".75"/>
      <circle cx="7" cy="7" r="2.5" fill="#5ADAA4" opacity=".75"/>
      <circle cx="31" cy="13" r="5" fill="#5ADAA4"/>
      <circle cx="31" cy="31" r="5" fill="#5ADAA4"/>
      <circle cx="13" cy="31" r="5" fill="#5ADAA4"/>
      <circle cx="13" cy="13" r="5" fill="#5ADAA4"/>
      <circle cx="22" cy="8" r="3" fill="white"/>
      <circle cx="36" cy="22" r="3" fill="white"/>
      <circle cx="22" cy="36" r="3" fill="white"/>
      <circle cx="8" cy="22" r="3" fill="white"/>
      <rect x="18" y="18" width="8" height="8" rx="1.5" fill="white"/>
    </svg>
    <span>ÁgoraEX</span>
  </div>
  <div id="header-center">IDEAS RECOGIDAS HOY</div>
  <div id="header-right">Actualizado: <span id="ts">--:--:--</span></div>
</div>

<div id="main">
  <div class="card card-bg-default">
    <div class="card-label">Ciudadanos participantes</div>
    <div class="card-body" style="align-items:flex-start;justify-content:flex-end">
      <div class="card-big" id="val-total">428</div>
    </div>
  </div>

  <div class="card card-bg-blue">
    <div class="card-label">Tema más votado</div>
    <div class="card-body" style="justify-content:flex-end">
      <div class="card-tema" id="val-tema">TRÁMITES</div>
    </div>
  </div>

  <div class="card card-bg-default">
    <div class="card-label">Idea más popular</div>
    <div class="card-body" style="justify-content:flex-end">
      <div class="card-idea" id="val-idea">"Sin tanto papeleo"</div>
    </div>
  </div>

  <div class="card card-bg-default">
    <div class="card-label">Objetivo del día</div>
    <div class="card-body" style="justify-content:flex-end;gap:0">
      <div class="card-pct" id="val-pct">85%</div>
      <div class="progress-track"><div class="progress-fill" id="val-bar" style="width:85%"></div></div>
      <div class="progress-label"><span id="val-count">428</span> / 500 participantes</div>
    </div>
  </div>
</div>

<div id="footer">
  <div id="footer-left">
    <svg id="eu-dash" width="60" height="40" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
      <rect width="60" height="40" rx="3" fill="#003399"/>
    </svg>
    <span>Cofinanciado por la Unión Europea</span>
  </div>
  <div id="footer-right">Junta de Extremadura</div>
</div>

<script>
function starPoints(cx,cy,R,r){
  var pts=[];
  for(var i=0;i<10;i++){
    var a=-Math.PI/2+i*Math.PI/5;
    var rad=(i%2===0)?R:r;
    pts.push((cx+rad*Math.cos(a)).toFixed(2)+','+(cy+rad*Math.sin(a)).toFixed(2));
  }
  return pts.join(' ');
}
function buildEUFlag(svgId){
  var svg=document.getElementById(svgId);
  if(!svg)return;
  var g=document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('fill','#FFCC00');
  for(var k=0;k<12;k++){
    var a=-Math.PI/2+k*Math.PI/6;
    var poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');
    poly.setAttribute('points',starPoints(30+13*Math.cos(a),20+13*Math.sin(a),2.8,1.1));
    g.appendChild(poly);
  }
  svg.appendChild(g);
}

function getData(){
  var responses=JSON.parse(localStorage.getItem('agx_d1_responses')||'[]');
  var total=responses.length;
  if(total===0){
    return{total:428,topP1:'tramites',topP2:'Sin tanto papeleo',demo:true};
  }
  var p1counts={tramites:0,atencion:0,digital:0};
  responses.forEach(function(r){if(r.p1)p1counts[r.p1]=(p1counts[r.p1]||0)+1;});
  var topP1=Object.keys(p1counts).reduce(function(a,b){return p1counts[a]>=p1counts[b]?a:b},'tramites');
  var p2counts={};
  responses.forEach(function(r){if(r.p2&&r.p2.trim())p2counts[r.p2.trim()]=(p2counts[r.p2.trim()]||0)+1;});
  var topP2=Object.keys(p2counts).length>0
    ?Object.keys(p2counts).reduce(function(a,b){return p2counts[a]>=p2counts[b]?a:b})
    :null;
  return{total:total,topP1:topP1,topP2:topP2,demo:false};
}

function temaLabel(t){
  if(t==='tramites')return'TRÁMITES';
  if(t==='atencion')return'ATENCIÓN';
  if(t==='digital')return'SERVICIOS DIGITALES';
  return'TRÁMITES';
}

function pad(n){return n<10?'0'+n:n;}

function refresh(){
  var d=getData();
  var pct=Math.min(100,Math.round(d.total/500*100));

  document.getElementById('val-total').textContent=d.total;
  document.getElementById('val-tema').textContent=temaLabel(d.topP1);
  document.getElementById('val-idea').textContent=d.topP2?'"'+d.topP2+'"':'Sin datos aún';
  document.getElementById('val-pct').textContent=pct+'%';
  document.getElementById('val-bar').style.width=pct+'%';
  document.getElementById('val-count').textContent=d.total;

  var now=new Date();
  document.getElementById('ts').textContent=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
}

setInterval(refresh,5000);
document.addEventListener('DOMContentLoaded',function(){
  buildEUFlag('eu-dash');
  refresh();
});
</script>
</body>
</html>
